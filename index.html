<style>
:root,html[data-theme=light]{
  --bg:#e3e6e9; --card:#f2f3f5; --card2:#e8ebee; --field:#fbfbfc;
  --ink:#1c2329; --muted:#66707a; --line:#cfd4d9; --line2:#b9c0c7;
  --accent:#1f5f9e; --accent2:#174a7c; --accent-soft:#dde7f2; --ring:rgba(31,95,158,.18);
  --head:#383e42; --head2:#454c51;
  --warn:#965006; --warn-soft:#f6e8d4; --warn-line:#e9cfa8;
  --bad:#ad2a20; --bad-soft:#f5e0dd; --good:#1d6a3a; --good-soft:#dcede1;
  --rough:#383e42; --rough-soft:#e6e8ea; --normal:#2a6a66; --normal-soft:#d9ebe9;
  --row-hover:#f1f4f7; --th-ink:#55606a; --td-line:#e2e6ea; --info-ink:#1d3550; --info-line:#c6d7ea;
  --sub-ink:#4d5862; --sub-hover:rgba(255,255,255,.65); --tab-on:#e3e6e9;
  --shadow:0 1px 0 rgba(255,255,255,.7) inset,0 1px 3px rgba(20,28,36,.06);
}
html[data-theme=dark]{
  --bg:#15181b; --card:#1c2024; --card2:#23282d; --field:#181b1f;
  --ink:#e4e8eb; --muted:#95a0aa; --line:#2d333a; --line2:#3b434b;
  --accent:#6aa6e8; --accent2:#a3c7f1; --accent-soft:#1b2c3f; --ring:rgba(106,166,232,.22);
  --head:#0f1215; --head2:#1b1f23;
  --warn:#efb15d; --warn-soft:#382b19; --warn-line:#5a4422;
  --bad:#ff8f84; --bad-soft:#3b2321; --good:#86d6a2; --good-soft:#1b3123;
  --rough:#c9d0d6; --rough-soft:#2c3236; --normal:#86cbc5; --normal-soft:#1a3331;
  --row-hover:#20262b; --th-ink:#a7b1ba; --td-line:#2a3036; --info-ink:#cfe0f2; --info-line:#2b425c;
  --sub-ink:#a7b1ba; --sub-hover:rgba(255,255,255,.05); --tab-on:#15181b;
  --shadow:0 1px 3px rgba(0,0,0,.3);
}
@media (prefers-color-scheme: dark){html[data-theme=auto]{
  --bg:#15181b; --card:#1c2024; --card2:#23282d; --field:#181b1f;
  --ink:#e4e8eb; --muted:#95a0aa; --line:#2d333a; --line2:#3b434b;
  --accent:#6aa6e8; --accent2:#a3c7f1; --accent-soft:#1b2c3f; --ring:rgba(106,166,232,.22);
  --head:#0f1215; --head2:#1b1f23;
  --warn:#efb15d; --warn-soft:#382b19; --warn-line:#5a4422;
  --bad:#ff8f84; --bad-soft:#3b2321; --good:#86d6a2; --good-soft:#1b3123;
  --rough:#c9d0d6; --rough-soft:#2c3236; --normal:#86cbc5; --normal-soft:#1a3331;
  --row-hover:#20262b; --th-ink:#a7b1ba; --td-line:#2a3036; --info-ink:#cfe0f2; --info-line:#2b425c;
  --sub-ink:#a7b1ba; --sub-hover:rgba(255,255,255,.05); --tab-on:#15181b;
  --shadow:0 1px 3px rgba(0,0,0,.3);
}}
html[data-theme=dark],html[data-theme=dark] input,html[data-theme=dark] select,html[data-theme=dark] textarea{color-scheme:dark}
@media (prefers-color-scheme: dark){html[data-theme=auto],html[data-theme=auto] input,html[data-theme=auto] select{color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans",Vazirmatn,"Noto Naskh Arabic",Tahoma,sans-serif;font-size:14.5px;line-height:1.62;font-feature-settings:"tnum" 1}
.ico{width:18px;height:18px;flex:none;vertical-align:-4px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ico.sm{width:15px;height:15px;vertical-align:-3px}
/* header: brushed anthracite (RAL 7016) */
.topbar{color:#e9edf0;background:
  repeating-linear-gradient(90deg,rgba(255,255,255,.025) 0 1px,transparent 1px 3px),
  linear-gradient(180deg,var(--head2),var(--head));}
.topbar .in{max-width:1260px;margin:0 auto;padding:16px 20px 12px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.logo{width:44px;height:44px;border-radius:10px;background:linear-gradient(145deg,#c9ced3,#8e969d);display:flex;align-items:center;justify-content:center;box-shadow:inset 0 1px 0 rgba(255,255,255,.6),0 2px 6px rgba(0,0,0,.25)}
.logo .ico{width:24px;height:24px;stroke:#2b3135;stroke-width:2}
h1{font-size:1.15rem;margin:0;font-weight:700;letter-spacing:.1px}
.sub-title{font-size:.78rem;color:#aab3ba;direction:ltr;text-align:right;letter-spacing:.3px}
.status{font-size:.8rem;color:#d5dde2;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1);padding:4px 12px;border-radius:999px;display:flex;align-items:center;gap:7px}
.status::before{content:"";width:7px;height:7px;border-radius:50%;background:#7bd39b;box-shadow:0 0 0 3px rgba(123,211,155,.18)}
.status.me::before{display:none}
.status.err::before{background:#ffb36b;box-shadow:0 0 0 3px rgba(255,179,107,.18)}
.seg{display:flex;background:rgba(0,0,0,.22);border:1px solid rgba(255,255,255,.1);border-radius:9px;padding:2px}
.seg button{border:none;background:none;color:#b7c0c6;padding:5px 9px;border-radius:7px;cursor:pointer;display:flex;align-items:center;gap:5px;font:inherit;font-size:.78rem}
.seg button:hover{color:#fff}
.seg button.on{background:rgba(255,255,255,.14);color:#fff}
nav.tabs{max-width:1260px;margin:0 auto;padding:0 20px;display:flex;gap:2px;flex-wrap:wrap}
nav.tabs button{display:flex;align-items:center;gap:7px;border:none;background:transparent;color:#b5bec5;padding:10px 15px 11px;border-radius:9px 9px 0 0;cursor:pointer;font:inherit;font-size:.9rem}
nav.tabs button:hover{color:#fff;background:rgba(255,255,255,.05)}
nav.tabs button.on{background:var(--tab-on);color:var(--ink);font-weight:700}
nav.tabs button.on .ico{color:var(--accent)}
.ral{height:5px;display:flex}
.ral span{flex:1}
.wrap{max-width:1260px;margin:0 auto;padding:20px}
h2{font-size:1.02rem;margin:0 0 12px;display:flex;align-items:center;gap:8px;font-weight:700}
h2 .ico{color:var(--accent)}
h3{font-size:.95rem;margin:20px 0 8px;display:flex;align-items:center;gap:8px;font-weight:700}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin-bottom:16px;box-shadow:var(--shadow)}
.card .card{box-shadow:none;border-radius:10px}
.layout{display:grid;grid-template-columns:280px 1fr;gap:18px;align-items:start}
.layout>aside{position:sticky;top:12px}
.layout>section,.layout>aside{min-width:0}
@media (max-width:920px){.layout{grid-template-columns:1fr}.layout>aside{position:static}}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grow{flex:1}
button.btn,label.btn{font:inherit;font-size:.88rem;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line2);background:var(--field);color:var(--ink);padding:7px 13px;border-radius:8px;cursor:pointer;transition:border-color .12s,color .12s,background .12s}
button.btn:hover,label.btn:hover{border-color:var(--accent);color:var(--accent)}
button.pri{background:var(--accent);border-color:var(--accent);color:#fff}
html[data-theme=dark] button.pri{color:#0d1a28}
@media (prefers-color-scheme: dark){html[data-theme=auto] button.pri{color:#0d1a28}}
button.pri:hover{background:var(--accent2);border-color:var(--accent2);color:#fff}
button.danger{color:var(--bad)}
button.danger:hover{border-color:var(--bad);color:var(--bad)}
button.x{border:none;background:none;color:var(--muted);cursor:pointer;font-size:1rem;padding:2px 6px;border-radius:6px}
button.x:hover{color:var(--bad);background:var(--bad-soft)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--field);border:1px solid var(--line2);border-radius:7px;padding:6px 9px}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--ring)}
input:disabled{background:var(--card2);color:var(--muted)}
input[type=checkbox]{width:17px;height:17px;accent-color:var(--accent);cursor:pointer;vertical-align:middle}
input.num{width:100px;text-align:left;direction:ltr}
input.code{width:120px;direction:ltr;text-align:left}
input.paint{width:140px;direction:ltr;text-align:left}
textarea{width:100%;min-height:110px;direction:ltr;text-align:left;font-family:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;font-size:.84rem}
table{border-collapse:separate;border-spacing:0;width:100%;background:var(--field);border:1px solid var(--line);border-radius:8px;overflow:hidden}
th,td{border-bottom:1px solid var(--td-line);padding:7px 9px;text-align:right;vertical-align:middle}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover td{background:var(--row-hover)}
th{font-size:.78rem;color:var(--th-ink);font-weight:600;white-space:nowrap;background:var(--card2)}
td.n,th.n{text-align:left;direction:ltr;font-variant-numeric:tabular-nums;white-space:nowrap}
td.ltr,td b.ltr{white-space:nowrap}
.pdate{font-size:.76rem;white-space:nowrap}
.ltr{direction:ltr;unicode-bidi:isolate}
.tbl-scroll{overflow-x:auto;max-height:560px;overflow-y:auto;border-radius:8px}
.tbl-scroll thead th{position:sticky;top:0;z-index:1}
.pill{flex:none;display:inline-flex;align-items:center;gap:4px;padding:1px 9px;border-radius:999px;font-size:.76rem;font-weight:600;white-space:nowrap}
.pill.N{background:var(--normal-soft);color:var(--normal)}
.pill.P{background:var(--rough-soft);color:var(--rough)}
.pill.Q{background:var(--warn-soft);color:var(--warn)}
.sw{display:inline-block;width:14px;height:14px;border-radius:50%;vertical-align:-2px;margin-inline-end:7px;border:1px solid rgba(0,0,0,.18);box-shadow:inset 0 1px 1px rgba(255,255,255,.35)}
.sw.none{background:repeating-linear-gradient(45deg,var(--line) 0 2px,transparent 2px 4px);border-color:var(--line2)}
.sw.big{width:40px;height:40px;margin:0;border:2px solid rgba(255,255,255,.85);box-shadow:0 0 0 1px rgba(0,0,0,.18),0 3px 8px rgba(0,0,0,.18),inset 0 -6px 10px rgba(0,0,0,.12),inset 0 5px 8px rgba(255,255,255,.35)}
.sw.big.none{display:inline-flex;align-items:center;justify-content:center;background:var(--card2);border:2px dashed var(--line2);box-shadow:none}.sw.big.none::after{content:"?";color:var(--muted);font-weight:700}
.swin{width:34px;height:34px;padding:0;border:2px solid var(--line2);border-radius:50%;overflow:hidden;cursor:pointer;vertical-align:middle;background:none}
.swin::-webkit-color-swatch-wrapper{padding:0}.swin::-webkit-color-swatch{border:none;border-radius:50%}.swin::-moz-color-swatch{border:none;border-radius:50%}
.swin.none{opacity:.45;border-style:dashed}
.pcard>.psw{overflow:visible;padding:2px}
html[data-glass="1"] .pcard{box-shadow:0 1px 3px rgba(0,0,0,.06);-webkit-backdrop-filter:none;backdrop-filter:none}
.ok{color:var(--good);font-weight:600}
.short{color:var(--bad);font-weight:700}
.note{background:var(--warn-soft);color:var(--warn);border:1px solid var(--warn-line);border-radius:8px;padding:9px 13px;margin:8px 0;font-size:.87rem}
.info{background:var(--accent-soft);color:var(--info-ink);border:1px solid var(--info-line);border-radius:8px;padding:9px 13px;margin:8px 0;font-size:.87rem}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-bottom:14px}
.kpi{background:var(--field);border:1px solid var(--line);border-radius:10px;padding:13px 16px;border-inline-start:4px solid var(--accent)}
.kpi .l{font-size:.8rem;color:var(--muted);display:flex;align-items:center;gap:6px}
.kpi .v{font-size:1.55rem;font-weight:600;direction:ltr;text-align:right;margin-top:2px;letter-spacing:-.3px}
.kpi .v.bad{color:var(--bad)}
.kpi:has(.v.bad){border-inline-start-color:var(--bad)}
.muted{color:var(--muted);font-size:.86rem}
.plist{display:flex;flex-direction:column;gap:6px;max-height:70vh;overflow:auto}
.pitem{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:9px;cursor:pointer;background:var(--field);transition:border-color .12s}
.pitem:hover{border-color:var(--accent)}
.pitem .grow{min-width:0}
.pitem.on{border-color:var(--accent);background:var(--accent-soft)}
.pitem .pi{flex:none;width:34px;height:34px;border-radius:8px;background:var(--card2);display:flex;align-items:center;justify-content:center;color:var(--accent)}
.pitem.on .pi{background:var(--accent);color:#fff}
.sub{display:flex;gap:4px;margin:14px 0 18px;flex-wrap:wrap;background:var(--card2);padding:4px;border-radius:10px;border:1px solid var(--line)}
.sub button{font:inherit;font-size:.86rem;display:flex;align-items:center;gap:6px;background:none;border:none;padding:7px 12px;cursor:pointer;color:var(--sub-ink);border-radius:7px}
.sub button:hover{background:var(--sub-hover);color:var(--ink)}
.sub button.on{background:var(--field);color:var(--accent);font-weight:700;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.sub .sep{width:1px;background:var(--line2);margin:5px 3px}
details summary{cursor:pointer;color:var(--accent);margin:6px 0;font-weight:600}
.dlg-bg{position:fixed;inset:0;background:rgba(15,20,25,.45);display:flex;align-items:center;justify-content:center;z-index:50}
.dlg{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px;max-width:440px;width:92%;box-shadow:0 12px 40px rgba(0,0,0,.25)}
.hide{display:none!important}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:.85rem;margin:6px 0}
.ptitle{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.ptitle input#pName{font-weight:700;font-size:1.08rem;background:transparent;border-color:transparent;padding-inline:4px}
.ptitle input#pName:hover,.ptitle input#pName:focus{background:var(--field);border-color:var(--line2)}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
@media (max-width:640px){ .wrap{padding:10px} input.num{width:80px} input.code{width:90px} input.paint{width:105px} nav.tabs button{padding:8px 10px;font-size:.84rem} nav.tabs button span{display:none} nav.tabs button.on span{display:inline} }

/* ===== Glass theme ===== */
html[data-glass="1"]:not([data-theme=dark]){--card:rgba(255,255,255,.5);--card2:rgba(255,255,255,.42);--field:rgba(255,255,255,.78);--line:rgba(255,255,255,.75);--td-line:rgba(120,130,140,.18);--row-hover:rgba(255,255,255,.55);--gl-edge:rgba(255,255,255,.85);--gl-sh:0 10px 34px rgba(30,40,60,.10)}
html[data-glass="1"][data-theme=dark]{--card:rgba(28,32,38,.55);--card2:rgba(40,46,54,.5);--field:rgba(20,24,28,.6);--line:rgba(255,255,255,.10);--td-line:rgba(255,255,255,.07);--row-hover:rgba(255,255,255,.05);--gl-edge:rgba(255,255,255,.14);--gl-sh:0 10px 34px rgba(0,0,0,.35)}
@media (prefers-color-scheme: dark){html[data-glass="1"][data-theme=auto]{--card:rgba(28,32,38,.55);--card2:rgba(40,46,54,.5);--field:rgba(20,24,28,.6);--line:rgba(255,255,255,.10);--td-line:rgba(255,255,255,.07);--row-hover:rgba(255,255,255,.05);--gl-edge:rgba(255,255,255,.14);--gl-sh:0 10px 34px rgba(0,0,0,.35)}}
html[data-glass="1"] body{background:
  radial-gradient(900px 600px at 8% -5%,color-mix(in srgb,var(--accent) 50%,transparent),transparent 62%),
  radial-gradient(800px 560px at 105% 18%,color-mix(in srgb,var(--accent2) 42%,transparent),transparent 60%),
  radial-gradient(900px 600px at 40% 115%,color-mix(in srgb,var(--accent) 34%,transparent),transparent 62%),
  var(--bg);background-attachment:fixed;min-height:100vh}
html[data-glass="1"] .card,html[data-glass="1"] .tile,html[data-glass="1"] .urow,html[data-glass="1"] .dlg,html[data-glass="1"] .sub,html[data-glass="1"] .bnav,html[data-glass="1"] .kpi,html[data-glass="1"] .tsrch,html[data-glass="1"] .pcard,html[data-glass="1"] .qcard,html[data-glass="1"] .rcard{
  -webkit-backdrop-filter:blur(18px) saturate(160%);backdrop-filter:blur(18px) saturate(160%);border-color:var(--gl-edge);box-shadow:var(--gl-sh),inset 0 1px 0 var(--gl-edge)}
html[data-glass="1"] .card .card{-webkit-backdrop-filter:none;backdrop-filter:none;box-shadow:none}
html[data-glass="1"] .card{border-radius:18px}
html[data-glass="1"] .tile{border-radius:22px}
html[data-glass="1"] .tile:hover{box-shadow:0 14px 40px color-mix(in srgb,var(--accent) 22%,transparent)}
html[data-glass="1"] table{border-color:var(--gl-edge)}
html[data-glass="1"] .tbl-scroll thead th{-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
html[data-glass="1"] .topbar{background:linear-gradient(135deg,color-mix(in srgb,var(--head2) 82%,transparent),color-mix(in srgb,var(--accent) 45%,var(--head)));-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);box-shadow:0 6px 24px rgba(0,0,0,.12)}
html[data-glass="1"] .dlg-bg{background:rgba(15,20,25,.30);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
html[data-glass="1"] .dlg{background:color-mix(in srgb,var(--bg) 55%,var(--card));border-radius:20px}
html[data-glass="1"] button.pri{background:linear-gradient(135deg,var(--accent),var(--accent2));box-shadow:0 4px 14px color-mix(in srgb,var(--accent) 35%,transparent)}
html[data-glass="1"][data-theme=dark] button.pri{color:#111}
html[data-glass="1"] input,html[data-glass="1"] select,html[data-glass="1"] textarea{background:var(--field)}
.glsw{display:flex;align-items:center;gap:10px;margin:14px 0 4px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--field);cursor:pointer}
.glsw input{width:20px;height:20px}
/* wide dialog */
.dlg{max-height:92vh;overflow:auto}
.dlg.wide{max-width:1040px;width:96%;padding:22px 26px}
.mi-head{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin:10px 0 14px}
.mi-head label{display:flex;flex-direction:column;gap:5px;font-weight:600;font-size:.88rem}
.mi-head input,.mi-head select{width:100%!important;min-height:44px;font-size:1rem}
.mitbl td,.mitbl th{padding:6px 8px}
.mitbl input,.mitbl select{width:100%!important;min-height:44px;font-size:1rem}
.mitbl td.m2{font-weight:700;white-space:nowrap;min-width:90px;text-align:center}
.mitbl .x{border:none;background:none;font-size:1.3rem;color:var(--bad);cursor:pointer;padding:4px 8px}
.mi-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:10px}
.mi-tot{font-size:1.05rem;font-weight:800;color:var(--accent)}
@media (max-width:700px){.mitbl thead{display:none}.mitbl tr{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:8px;border-bottom:1px solid var(--line)}.mitbl td{border:none;padding:0}.mitbl td.m2{text-align:start}}

.selpaint{display:flex;align-items:center;gap:14px;padding:14px 16px;margin:4px 0 10px;border-radius:18px;background:var(--accent-soft);border:2px solid var(--accent);box-shadow:0 6px 18px color-mix(in srgb,var(--accent) 18%,transparent)}
.selpaint .spsw .sw.big{width:64px;height:64px;border-width:3px}
.selpaint .spinfo{flex:1;display:flex;flex-direction:column;min-width:0}
.selpaint .splb{font-size:.78rem;font-weight:700;color:var(--accent)}
.selpaint b{font-size:1.6rem;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:right}
.selpaint .spch{flex:none;padding:6px 12px;font-size:.85rem}

.qbox{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
.useg{display:grid;grid-template-columns:repeat(auto-fit,minmax(0,1fr));gap:4px;padding:4px;border-radius:16px;background:var(--card2);border:1px solid var(--line)}
.useg .chip{margin:0;border:none;border-radius:12px;min-height:48px;font-size:1.05rem;justify-content:center;display:flex;align-items:center;background:transparent}
.useg .chip.on{background:var(--accent);color:#fff;box-shadow:0 3px 10px color-mix(in srgb,var(--accent) 30%,transparent)}
.qstep{display:grid;grid-template-columns:64px 1fr 64px;gap:8px;align-items:stretch}
.qstep>.btn{height:64px;width:auto;justify-content:center;font-size:1.8rem;padding:0;border-radius:16px}
.qin{position:relative;display:flex}
.qin input{width:100%!important;height:64px;text-align:center;font-size:1.7rem!important;font-weight:700;border-radius:16px;padding-inline:44px}
.qin .qu{position:absolute;inset-inline-start:14px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:.9rem;pointer-events:none}
.qgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.qgrid .chip{margin:0;min-height:48px;justify-content:center;display:flex;align-items:center;border-radius:14px;font-size:.95rem;text-align:center}


/* mobile-first stock forms */
.pcard .psub{font-size:.76rem}.pcard .ppul{font-size:.72rem;opacity:.85;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media (max-width:640px){
  .wrap{padding:8px 6px!important}
  .invcard{padding:12px 8px!important;border-radius:16px}
  .invcard>h2{margin:0 4px 10px;font-size:1.05rem}
  .invcard .tapeform{border:none!important;background:transparent!important;box-shadow:none!important;padding:0!important;-webkit-backdrop-filter:none!important;backdrop-filter:none!important;margin:0}
  .invcard .tstep .lb{font-size:.95rem;margin:2px 4px 8px}
  #pfSearch{min-height:50px;font-size:1.05rem!important;border-radius:14px}
  .pgrid{max-height:calc(100vh - 330px);min-height:300px;gap:8px;padding:2px}
  .pcard{padding:12px 14px;border-radius:16px;gap:14px;min-height:76px}
  .pcard .sw.big{width:48px;height:48px}
  .pcard .pinfo b{font-size:1.18rem}
  .pcard .psub{font-size:.82rem}
  .pcard .qv{font-size:1.12rem}
  .stockbox{border-radius:14px}
}

nav.tabs{display:none!important}
.secbar{max-width:1260px;margin:0 auto;padding:0 20px 12px;display:flex;align-items:center;gap:12px;min-height:8px}
.secbar .back{display:flex;align-items:center;gap:6px;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.08);color:#eef3f0;border-radius:10px;padding:7px 13px;cursor:pointer;font:inherit;font-size:.9rem}
.secbar .back:hover{background:rgba(255,255,255,.16)}
.secbar .back .ico{transform:scaleX(-1)}
.secbar .ttl{display:flex;align-items:center;gap:8px;font-weight:700;font-size:1.05rem;color:#fff}
.hero{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:6px 0 18px}
.hero h2{font-size:1.45rem;margin:0}
.hero .muted{font-size:.9rem}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.tile{position:relative;display:flex;flex-direction:column;gap:10px;text-align:right;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;cursor:pointer;box-shadow:var(--shadow);transition:transform .15s,border-color .15s,box-shadow .15s;font:inherit;color:var(--ink);min-height:150px}
.tile:hover{transform:translateY(-2px);border-color:var(--accent);box-shadow:0 8px 24px rgba(0,0,0,.08)}
.tile:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.tile .tic{width:48px;height:48px;border-radius:14px;display:flex;align-items:center;justify-content:center;background:var(--tc-soft,var(--accent-soft));color:var(--tc,var(--accent))}
.tile .tic .ico{width:24px;height:24px}
.tile .tt{font-weight:700;font-size:1.08rem}
.tile .ts{color:var(--muted);font-size:.86rem;margin-top:-6px}
.tile .tv{margin-top:auto;font-size:1.35rem;font-weight:600;direction:ltr;text-align:right;letter-spacing:-.3px}
.tile .tv small{font-size:.8rem;color:var(--muted);font-weight:400;margin-inline-start:4px}
.tile .chev{position:absolute;top:18px;left:18px;color:var(--muted)}
.tile .badge{position:absolute;top:16px;left:44px}
.qa{display:flex;gap:10px;flex-wrap:wrap;margin:0 0 18px}
.qa button{display:flex;align-items:center;gap:8px;border:1px solid var(--line2);background:var(--field);color:var(--ink);border-radius:999px;padding:9px 16px;cursor:pointer;font:inherit;font-size:.9rem}
.qa button:hover{border-color:var(--accent);color:var(--accent)}
.qa button .ico{color:var(--accent)}

const dirty={}, writing={}, timers={};
function docData(path){
  if(path==='cfg/settings')return {...S.settings};
  if(path==='cfg/paints')return {list:S.paints};
  if(path==='cfg/profiles')return {list:S.profiles};
  if(path==='inv/incoming')return {list:S.manInc||[]};
  if(path.startsWith('periods/')){const p=S.periods[path.slice(8)];return p?JSON.parse(JSON.stringify(p)):null}
}
function save(path,delay=900){
  dirty[path]=true;
  if(!db){clearTimeout(timers.__local);timers.__local=setTimeout(()=>{localSave();dirty[path]=false;setStatus('✓ هاتە پاشەکەفتکرن')},500);return}
  setStatus('پاشەکەفتکرن...');
  clearTimeout(timers[path]);
  timers[path]=setTimeout(()=>flush(path),delay);
}
async function flush(path){
  if(writing[path]){timers[path]=setTimeout(()=>flush(path),400);return}
  const data=docData(path);
  writing[path]=true; dirty[path]=false;
  try{
    if(data===null) await db.doc(path).delete();
    else await db.doc(path).set(data);
    setStatus('✓ هاتە پاشەکەفتکرن');
  }catch(e){
    dirty[path]=true;
    if(e&&e.code==='unavailable'){setTimeout(()=>flush(path),1500)}
    else if(e&&e.code==='invalid_argument'){setStatus('⚠️ تو نەشێی ئەڤێ داتایێ بگوهۆڕی (دەستووری نەڤیسینێ نینە)',true)}
    else if(e&&e.code==='quota_exceeded'){setStatus('⚠️ جهێ داتابەیسێ تژی بوو',true)}
    else setStatus('⚠️ کێشە د پاشەکەفتکرنێ دا: '+(e&&e.message||e),true);
  }finally{writing[path]=false}
}

/* ======================= Calculation ======================= */
function brandKey(b){return norm(b)||'(بێ براند)'}
function tapeDef(w){return (S.settings.tapes||[]).find(t=>t.w===toNum(w))}
function rpbOf(w){const t=tapeDef(w);return (t&&t.rpb)||toNum(S.settings.rpb[w])||1}
function brandItems(b){if(Array.isArray(b.items))return b.items;const all=[];(S.settings.tapes||[]).forEach(t=>{all.push(t.w+'|N');all.push(t.w+'|P')});return all}
function offers(b,w,t){return brandItems(b).includes(w+'|'+t)}
function available(w,t){const d=tapeDef(w);if(!d||!d.on)return false;const bs=S.settings.brands||[];if(!bs.length)return true;const tt=t==='P'?'P':'N';return bs.some(b=>offers(b,w,tt))}
function brandObj(bk){return (S.settings.brands||[]).find(x=>brandKey(x.name)===bk)}
function availB(w,t,bk){const b=brandObj(bk);if(!b)return available(w,t);const d=tapeDef(w);return !!(d&&d.on&&offers(b,w,t==='P'?'P':'N'))}
function effWB(w,t,bk){let x=toNum(w);for(let i=0;i<5;i++){const d=tapeDef(x);if(d&&!availB(x,t,bk)&&d.sub>0&&d.sub!==x)x=d.sub;else break}return x}

function findHeader(rows,tests){
  for(let i=0;i<Math.min(rows.length,10);i++){
    const r=rows[i].map(c=>String(c??'').toLowerCase());

    const used=new Set();for(const [key,re] of Object.entries(tests)){const j=r.findIndex((c,ci)=>!used.has(ci)&&re.test(c));if(j>=0){idx[key]=j;used.add(j);hits++}}

  return (S.tx.out||[]).filter(t=>(t.sec==='box')===(K==='tape')).map(t=>{const d=t.at?ymdLocal(new Date(t.at)):'';const isP=t.sec!=='box';
      const kg=isP?(t.kg!=null?toNum(t.kg):toNum(t.qty)*kgcOf(P,t.key)):null;return {t,d,who:uName(t.u),item:txLabel(t.sec,t.key),kg,qty:toNum(t.qty)}})
    .filter(r=>(!f.from||r.d>=f.from)&&(!f.to||r.d<=f.to)&&(!f.u||r.t.u===f.u)&&(!qs.length||qs.every(x=>normQ(r.item+' '+r.who+' '+(r.t.note||'')).includes(x))))
    .sort((a,b)=>(b.t.at||'').localeCompare(a.t.at||''))}
function outGroups(rows){const by=(fn)=>{const m=new Map();rows.forEach(r=>{const k=fn(r);const g=m.get(k)||{k,kg:0,qty:0,n:0};g.kg+=r.kg||0;g.qty+=r.qty;g.n++;m.set(k,g)});return [...m.values()].sort((a,b)=>(b.kg||b.qty)-(a.kg||a.qty))};
  return {items:by(r=>r.item),people:by(r=>r.who)}}
const dmy=s=>s?s.split('-').reverse().join('/'):'';
function olView(){const f=olF();return f.view||'all'}
const hm=iso=>{if(!iso)return '';const d=new Date(iso);return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')};
function olTapeParts(r){const [b,w,t,l]=String(r.t.key||'').split('|');const bo=brandObj(b);const W=toNum(w),L=toNum(l);return {brand:bo?bo.name:b,w:W,t,len:L,m2:r.qty*(W/1000)*L*rpbOf(W)}}
function olCols(isP,hide,print){const C=[];
  if(hide!=='date')C.push({h:'ڕۆژ',v:r=>dmy(r.d),ltr:1,nw:1});
  C.push({h:'دەم',v:r=>hm(r.t.at),ltr:1,nw:1});
  if(hide!=='person')C.push({h:'کێ',v:r=>esc(r.who)+(r.t.rec&&!print?`<div class="muted" style="font-size:.72rem;font-weight:400">تۆمارکر: ${esc(uName(r.t.rec))}</div>`:''),b:1});
  if(hide!=='item'){if(isP)C.push({h:'سبغ',v:r=>esc(r.item),ltr:1,b:1,sw:1});
    else C.push({h:'کۆمپانی',v:r=>esc(r.tp.brand),ltr:1,b:1},{h:'پانی',v:r=>r.tp.w+' mm',ltr:1,nw:1},{h:'جۆر',v:r=>r.tp.t==='P'?'Rough':'Normal',pill:1},{h:'درێژی',v:r=>r.tp.len+' m',ltr:1,nw:1})}
  if(isP)C.push({h:'کیلۆ',v:r=>fmt(r.kg,1),n:1,b:1,sum:r=>r.kg||0,sd:1});
  C.push({h:'کارتۆن',v:r=>fmt(r.qty,isP?2:1),n:1,b:!isP,sum:r=>r.qty,sd:isP?2:1});
  if(!isP)C.push({h:'م²',v:r=>fmt(r.tp.m2,1),n:1,sum:r=>r.tp.m2,sd:1});
  C.push({h:'تێبینی',v:r=>esc(r.t.note||'')+(r.t.edited&&!print?` <span title="هاتیە گوهۆڕین ژ لایێ ${esc(uName(r.t.edited.by))}">✎</span>`:''),mut:1});return C}
function olRowsX(){const isP=S.invKind==='paint';return outRows().map(r=>isP?r:{...r,tp:olTapeParts(r)})}
function olGrouped(rows,view){if(view==='all')return [{k:null,rows}];const m=new Map();
  rows.forEach(r=>{const k=view==='person'?r.who:view==='date'?r.d:r.item;if(!m.has(k))m.set(k,[]);m.get(k).push(r)});
  const G=[...m.entries()].map(([k,rs])=>({k,rows:rs,kg:rs.reduce((s,r)=>s+(r.kg||0),0),qty:rs.reduce((s,r)=>s+r.qty,0),m2:rs.reduce((s,r)=>s+(r.tp?r.tp.m2:0),0)}));
  return view==='date'?G.sort((a,b)=>String(b.k).localeCompare(String(a.k))):G.sort((a,b)=>(b.kg||b.qty)-(a.kg||a.qty))}
function olTotTxt(isP,kg,q,m2){return isP?`${fmt(kg,1)} کیلۆ · ${fmt(q,1)} کارتۆن`:`${fmt(q,1)} کارتۆن · ${fmt(m2,1)} م²`}
function olTable(rows,isP,hide,print){const C=olCols(isP,hide,print);if(!print&&isAdmin)C.push({h:'',v:r=>`<span style="white-space:nowrap"><button class="x" data-act="txEdit" data-dir="out" data-id="${esc(r.t.id)}" title="گوهۆڕین">✎</button><button class="x" data-act="txDel" data-dir="out" data-id="${esc(r.t.id)}" title="ژێبرن">✕</button></span>`});const fi=C.findIndex(c=>c.sum);
  const cell=(c,r)=>{const v=c.v(r);if(print)return `<td class="${c.ltr?'ltr':''}">${c.b?'<b>'+v+'</b>':v}</td>`;
    return `<td class="${c.n?'n':''}${c.mut?' muted':''}"${c.ltr&&!c.n?' dir="ltr" style="text-align:right'+(c.nw?';white-space:nowrap':'')+'"':''}>${c.sw?sw(r.item):''}${c.pill?pill(r.tp.t==='P'?'P':'N'):c.b?'<b>'+v+'</b>':v}</td>`};
  const tot=`<tr class="${print?'tot':'olTot'}"><td colspan="${fi}"${print?'':' style="font-weight:700"'}>کۆم (${rows.length})</td>${C.slice(fi).map(c=>c.sum?`<td class="${print?'':'n'}"><b>${fmt(rows.reduce((s,r)=>s+c.sum(r),0),c.sd)}</b></td>`:'<td></td>').join('')}</tr>`;
  if(print)return `<table><tr><th>#</th>${C.map(c=>`<th>${c.h}</th>`).join('')}</tr>${rows.map((r,i)=>`<tr><td>${i+1}</td>${C.map(c=>cell(c,r)).join('')}</tr>`).join('')}${tot.replace('<td colspan="'+fi+'"','<td colspan="'+(fi+1)+'"')}</table>`;
  return `<div class="tbl-scroll" data-nosrch><table><thead><tr>${C.map(c=>`<th${c.n?' class="n"':''}>${c.h}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${C.map(c=>cell(c,r)).join('')}</tr>`).join('')}${tot}</tbody></table></div>`}
const olVLbl=(v,isP)=>({all:'هەمی تۆمار (ب پێی دەمی)',person:'ب پێی کەسی',item:'ب پێی '+(isP?'سبغێ':'جۆرێ لسقێ'),date:'ب پێی ڕۆژێ'})[v];

  const done=()=>{document.title=old;pa.innerHTML='';window.removeEventListener('afterprint',done)};window.addEventListener('afterprint',done);
  const go=()=>setTimeout(()=>window.print(),60);try{(document.fonts&&document.fonts.ready?Promise.race([document.fonts.ready,new Promise(r=>setTimeout(r,1500))]):Promise.resolve()).then(go)}catch(e){go()}}

  ${!db&&!OFFLINE?`<div class="note">داتابەیس گرێنەدایە — گوهۆڕین تەنێ ل سەر ڤی براوزەری دهێنە پاشەکەفتکرن و بکارهێنەرێن دی نابینن.<br><span style="font-size:.82rem">${capInfo.runtime?'ئەگەر: Claude پەیوەندی ب لاپەڕی کر لێ داتابەیس نەدا — بێگومان Tracking prevention یا براوزەری یان تو نەچوویە ناڤ هەژمارا Claude.':'ئەگەر: لاپەڕ ل دەرڤەی claude.ai هاتیە ڤەکرن (یان براوزەری پەیوەندی ب Claude ڤە گرت). لینکا دروست: claude.ai/artifact/PnPX7dKnxJSAiyDcFkLytG'}</span></div>`:''}

/* ======================= Events ======================= */
function bind(){
  const m=$('#main');
  m.querySelectorAll('[data-sub]').forEach(b=>b.onclick=()=>{S.sub=b.dataset.sub;render();window.scrollTo({top:0})});
  // period meta
  const p=S.cur&&S.periods[S.cur];
  if(p&&S.tab==='period'){
    const bindMeta=(id,f)=>{const el=$(id);if(el)el.oninput=()=>{p[f]=el.value;save('periods/'+p.id)}};
    bindMeta('#pName','name');bindMeta('#pStart','start');bindMeta('#pEnd','end');
    m.querySelectorAll('input[data-sel]').forEach(el=>el.onchange=()=>{ensP(p);const a=p.sel[el.dataset.sel];const k=el.dataset.k;const i=a.indexOf(k);if(el.checked&&i<0)a.push(k);if(!el.checked&&i>=0)a.splice(i,1);save('periods/'+p.id,600);render()});
    m.querySelectorAll('[data-po]').forEach(el=>el.oninput=()=>{getPo(p,el.dataset.po)[el.dataset.f]=el.value;save('periods/'+p.id,1200)});
    m.querySelectorAll('input[data-poq]').forEach(el=>el.oninput=()=>{ensP(p);const kind=el.dataset.poq;getPo(p,kind).qty[el.dataset.k]=el.value.trim()===''?0:toNum(el.value);save('periods/'+p.id,1200);
      const its=poItems(p,kind);const tt=m.querySelector(`[data-pot="${kind}"]`);if(tt)tt.textContent=fmt(its.reduce((s,x)=>s+x.qty,0),isPaintKind(kind)?3:1);
      if(kind==='tape'){const it=its.find(x=>x.key===el.dataset.k);const c=m.querySelector(`[data-pob="${CSS.escape(el.dataset.k)}"]`);if(c&&it)c.textContent=it.boxes?fmt(it.boxes,1):''}});
    const note=$('#pNote');if(note)note.oninput=()=>{p.note=note.value;save('periods/'+p.id,1500)};
    m.querySelectorAll('select[data-o]').forEach(el=>el.onchange=()=>{p.orders[+el.dataset.o].unit=el.value;save('periods/'+p.id)});
    m.querySelectorAll('input[data-o]').forEach(el=>el.oninput=()=>{
      const o=p.orders[+el.dataset.o];const f=el.dataset.f;o[f]=(f==='qty'||f==='wkg')?toNum(el.value):el.value;if(f==='wkg')delete o.wkgm;save('periods/'+p.id);
      if(f==='code'||f==='paint'){const {prof,paint}=maps();const ok=f==='code'?prof[norm(el.value)]:paint[norm(el.value)];el.style.borderColor=el.value&&!ok?'var(--bad)':'';
        if(f==='paint'){const td=el.closest('tr').children[8];td.innerHTML=ok?pill(ok.type):(el.value?pill('?'):'')}}
    });
    m.querySelectorAll('input[data-st]').forEach(el=>el.oninput=()=>{
      const kind=el.dataset.st,k=el.dataset.k;
      if(el.value.trim()==='')delete p.stock[kind][k];else p.stock[kind][k]=toNum(el.value);
      if(kind==='cart'&&el.value.trim()!==''&&!(toNum(p.stock.kgc[k])>0))p.stock.kgc[k]=kgcOf(p,k);
      if(kind==='kgc'){const d=paintDef(k);if(d&&toNum(el.value)>0&&d.kgc!==toNum(el.value)){d.kgc=toNum(el.value);save('cfg/paints',1500)}}
      if(kind==='box'){const c=m.querySelector(`[data-m2="${CSS.escape(k)}"]`);if(c)c.textContent=el.value.trim()?fmt(boxM2(p,k),1):''}
      if(kind==='cart'||kind==='kgc'){const c=m.querySelector(`[data-kg="${CSS.escape(k)}"]`);if(c){const v=stockKg(p,k);c.textContent=v?fmt(v,1):''}}
      save('periods/'+p.id);
    });
    const op=$('#ordPaste');if(op)op.oninput=()=>{const l=parseOrders(parseText(op.value),$('#ordUnit').value);const pv=$('#ordPreview');
      if(!op.value.trim()){pv.innerHTML='';return}
      const {prof,paint}=maps();const bp=l.filter(o=>!prof[norm(o.code)]).length,bc=l.filter(o=>!paint[norm(o.paint)]).length;
      pv.innerHTML=l.length?`✓ <b>${l.length}</b> ڕیز هاتنە ناسین — ${fmt(l.reduce((s,o)=>s+o.qty,0),0)} ${$('#ordUnit').value==='m'?'مەتر':'قەد'}`+(bp?` · <span class="short">${bp} کۆد نەناسراو</span>`:'')+(bc?` · <span class="short">${bc} سبغ نەناسراو</span>`:'')+' — «زێدە بکە» بکە':'<span class="short">چ ڕیز نەهاتنە ناسین</span>'};
    const of=$('#ordFile');if(of)of.onchange=async()=>{const f=of.files[0];if(!f)return;try{const rows=await readFileRows(f);importOrders(p,parseOrders(rows,$('#ordUnit').value))}catch(e){toast('⚠️ فایل نەهاتە خواندن. پەیست بکە ل جهێ وێ.')}};
  }
  if(isInvTab()){
    m.querySelectorAll('[data-invsub]').forEach(b=>b.onclick=()=>{S.invSub=b.dataset.invsub;render();window.scrollTo({top:0})});
    if(!can('inv_count')){m.querySelectorAll('input[data-st],select[data-len]').forEach(el=>el.disabled=true);m.querySelectorAll('[data-act=addLen]').forEach(el=>el.remove())}
    m.querySelectorAll('[data-txk]').forEach(b=>b.onclick=()=>{const [dir,k]=b.dataset.txk.split(':');txF(dir).kind=k;render()});
    m.querySelectorAll('input[data-rcv]').forEach(el=>el.oninput=()=>{const id=el.dataset.rcv,k=el.dataset.k;const f=rcvF(id);f.q[k]=el.value;
      const o=openPos().find(x=>x.p.id+'~'+x.kind===id);const it=o&&o.items.find(i=>i.key===k);const c=m.querySelector(`[data-rcvc="${CSS.escape(id+'#'+k)}"]`);
      if(c&&it){const q=toNum(el.value);c.textContent=q>0?fmt(rcvAmt(o,f,it,q),isPaintKind(o.kind)?3:1):''}});
    m.querySelectorAll('[data-rcvf]').forEach(el=>{const h=()=>{const f=rcvF(el.dataset.rcvf);f[el.dataset.f]=el.value;if(el.tagName==='SELECT')render()};if(el.tagName==='SELECT')el.onchange=h;else el.oninput=h});
    m.querySelectorAll('[data-binunit]').forEach(el=>el.onchange=()=>{binF().unit=el.value;render()});
    {const ps=m.querySelector('#pfSearch');if(ps)ps.oninput=()=>{const qs=normQ(ps.value).trim().split(' ').filter(Boolean);let n=0;m.querySelectorAll('#pfGrid .pcard').forEach(c=>{const ok=qs.every(x=>c.dataset.n.includes(x));c.style.display=ok?'':'none';if(ok)n++});const z=m.querySelector('#pfNone');if(z)z.style.display=n?'none':''}}
    {const cq=m.querySelector('#custQ');if(cq)cq.onchange=cq.onsearch=()=>{S.custQ=cq.value;render()}}
    {const uq=m.querySelector('#uQ');if(uq)uq.oninput=()=>{S.uQ=uq.value;const q=normQ(uq.value);m.querySelectorAll('.urow').forEach(r=>{r.style.display=!q||normQ(r.querySelector('.uhead').textContent).includes(q)?'':'none'})}}
    {const pp=m.querySelector('#pPick');if(pp)pp.onchange=()=>{S.cur=pp.value;render();window.scrollTo({top:0})}}
    m.querySelectorAll('[data-olf]').forEach(el=>el.onchange=()=>{olF()[el.dataset.olf]=el.value;render()});
    m.querySelectorAll('[data-binf]').forEach(el=>el.oninput=()=>{binF()[el.dataset.binf]=el.value});
    m.querySelectorAll('[data-bin]').forEach(el=>{const h=()=>{const f=binF();const r=f.rows[+el.dataset.bin];if(!r)return;r[el.dataset.f]=el.value;
      const c=m.querySelector(`[data-bincur="${el.dataset.bin}"]`);if(c)c.textContent=binCur(r);
      if(el.dataset.f==='paint')el.style.borderColor=el.value&&!paintDef(norm(el.value))?'var(--bad)':'';
      const s=$('#binSum');if(s){const n=f.rows.filter(x=>toNum(x.qty)>0).length,tq=f.rows.reduce((a,x)=>a+toNum(x.qty),0);s.textContent=n?`${n} ڕیز · ${fmt(tq,f.unit==='t'?3:1)} ${binUnitLbl(f)}`:''}};

function importOrders(p,list){
  if(!list.length){toast('⚠️ چ ڕیز نەهاتنە ناسین. ڕیزبەندی: Code · Coating · Qty');return}
  if($('#ordReplace')&&$('#ordReplace').checked)p.orders=[];
  p.orders.push(...list);save('periods/'+p.id,200);
  const {prof}=maps();let learned=0;
  list.forEach(o=>{const wk=owk(o);const x=prof[norm(o.code)];const m=o.unit==='m'?toNum(o.qty):toNum(o.qty)*(lenM(o)||S.settings.bar);
    if(wk>0&&m>0&&x){const kgm=+(wk/m).toFixed(4);if(Math.abs((x.w||0)-kgm)>1e-4){x.w=kgm;learned++}}});
  if(learned)save('cfg/profiles',300);
  toast(`✓ ${fmt(list.length,0)} ڕیز هاتنە زێدەکرن`+(learned?` · کێشا ${learned} پڕۆفایلان (kg/m) هاتە پاشەکەفتکرن`:''));render();
}

      docs.push({at:new Date().toISOString(),u:myUid(),sec,key,qty,...(kg!==null?{kg:+kg.toFixed(2)}:{}),note:('PO '+(o.po.no||'')+(f.note?' · '+f.note:'')).trim(),po:{pid:o.p.id,kind:o.kind,key:i.key},poAmt:+rcvAmt(o,f,i,q).toFixed(4),rdate:f.date||today()})});

    if(await addTx('in',docs)){f.q={};f.note='';const o2=openPos().find(x=>x.p.id+'~'+x.kind===id);
      toast(`✓ ${docs.length} تشت هاتنە داخلکرن (${isP?fmt(docs.reduce((s,d)=>s+d.kg,0),1)+' کیلۆ':fmt(docs.reduce((s,d)=>s+d.qty,0),1)+' کارتۆن'})`+(o2&&o2.done?' — داخوازی ب تەمامی گەهشت ✓':''));render()}}
  else if(act==='myProfile'){myProfile()}
  else if(act==='manInc'){manIncDialog()}
  else if(act==='manDel'&&isAdmin){const id=t0.dataset.id;const o=openPos().find(x=>x.p.id+'~'+x.kind===id);if(!o||!o.p.__man)return;if(o.items.some(i=>i.rcv>0)){toast('⚠️ هندەک ژێ گەهشتینە — «داخستن» بکە');return}
    dialog('<p>ئەڤ تۆمارا «ل ڕێیە» ژێببە؟</p>',()=>{S.manInc=(S.manInc||[]).filter(m=>m!==o.p.__man);save('inv/incoming',100);render()},'ژێببە')}
  else if(act==='dcFix'&&p){dcFix(p,t0.dataset.k)}
  else if(act==='ptype'&&p){p.ptype=p.ptype||{};p.ptype[t0.dataset.k]=t0.dataset.v;save('periods/'+p.id,100);render()}
  else if(act==='poEarly'&&isAdmin){const id=t0.dataset.id;const o=openPos().find(x=>x.p.id+'~'+x.kind===id);if(!o)return;o.po.early=true;savePoOwner(o);render();toast('✅ نوکە دشێی داخل بکەی')}
  else if(act==='rcvUndo'&&isAdmin){const id=t0.dataset.id;const t=(S.tx.in||[]).find(x=>x.id===id);if(!t)return;
    dialog(`<p>ئەڤ گەهشتنە ژێببە؟ (<b>${t.kg?fmt(t.kg,1)+' کیلۆ':fmt(t.qty,1)+' کارتۆن'}</b> ${esc(txLabel(t.sec,t.key))})</p><p class="muted">دێ ژ مەخزەنێ کێم بیت و دیسا وەک «ل ڕێیە / هێشتا نەگەهشتیە» دیار بیت.</p>`,async()=>{
      if(!db){S.tx.in=S.tx.in.filter(x=>x.id!==id);recomputeInv();localSave();render();return}try{await db.doc('invin/'+id).delete();toast('↩️ هاتە ژێبرن — هێشتا نەگەهشتیە')}catch(e){toast('⚠️ ژێبرن نەبوو')}},'ژێببە')}
  else if(act==='resPdf'&&p){printHtml(resPrintHtml(p,t0.dataset.what),`results-${t0.dataset.what}-${p.start}_${p.end}`)}
  else if(act==='custCancel'&&p){const k=t0.dataset.k;p.cancel=p.cancel||[];const on=p.cancel.includes(k);
    const doIt=()=>{p.cancel=on?p.cancel.filter(x=>x!==k):[...p.cancel,k];save('periods/'+p.id,100);render();toast(on?`↩️ داخوازی ${k} زڤڕی د حیسابێ دا`:`❌ داخوازی ${k} هاتە بەتالکرن — ژ حیسابێ سبغ و لسقێ دەرکەفت`)};
    if(on)doIt();else dialog(`<p>داخوازیا <b dir="ltr">${esc(k)}</b> بەتال بکە؟ ئۆردەرێن وێ ژ حیسابێ ماوەیێ (سبغ و لسق) دەردکەڤن، لێ ژێ نابن — دشێی پاشی ڤەگەڕینی.</p>`,doIt,'بەتالکرن')}
  else if(act==='olPrint'){olPdfAsk()}
  else if(act==='txSet'){const f=txF(t0.dataset.dir);if(t0.dataset.f==='paint'&&t0.closest('#pfGrid'))S.goQty=1;if(t0.dataset.f==='paint'&&f.paint!==t0.dataset.v)f.qty='';if(t0.dataset.f==='unit'&&f.unit!==t0.dataset.v)f.qty='';f[t0.dataset.f]=t0.dataset.f==='w'||t0.dataset.f==='len'?toNum(t0.dataset.v):t0.dataset.v;render()}
  else if(act==='txPick'){const f=txF(t0.dataset.dir);const [b,w,tt,l]=t0.dataset.k.split('|');const bo=brandObj(b);f.brand=bo?bo.name:b;f.w=toNum(w);f.t=tt;f.len=toNum(l);render()}
  else if(act==='txStep'){const f=txF(t0.dataset.dir);const st=f.kind==='paint'?paintStep(f,norm(f.paint)):1;f.qty=String(+Math.max(0,toNum(f.qty)+toNum(t0.dataset.d)*st).toFixed(3));render()}
  else if(act==='olQuick'){const f=olF();f.to=today();f.from=t0.dataset.r==='today'?today():today().slice(0,8)+'01';render()}
  else if(act==='binAdd'){const f=binF();for(let i=0;i<toNum(t0.dataset.n);i++)f.rows.push(binNew());render()}
  else if(act==='binDel'){const f=binF();f.rows.splice(+t0.dataset.i,1);if(!f.rows.length)f.rows.push(binNew());render()}
  else if(act==='binSave'){if(!can('inv_in')){toast('⚠️ ئەڤ کار بۆ تە نەهاتیە ڤەکرن');return}const f=binF();const isP=S.invKind==='paint';const docs=[],bad=[];
    f.rows.forEach((r,i)=>{const q=toNum(r.qty);if(!(q>0))return;let sec,key;
      let qty=q,kg=null;
      if(isP){const k=norm(r.paint);if(!paintDef(k)){bad.push(i+1);return}sec='cart';key=k;if(f.unit!=='ctn'){kg=f.unit==='t'?q*1000:q;qty=+(kg/kgcOf({stock:S.inv||normStock({})},k)).toFixed(4)}}
      else{if(!r.brand){bad.push(i+1);return}sec='box';key=brandKey(r.brand)+'|'+toNum(r.w)+'|'+r.t+'|'+toNum(r.len)}
      docs.push({at:new Date().toISOString(),u:myUid(),sec,key,qty,...(kg!==null?{kg:+kg.toFixed(2)}:{}),note:String(f.note||'').trim(),rdate:f.date||today()})});
    if(bad.length){toast(`⚠️ ڕیز ${bad.join('، ')}: ${isP?'ئەڤ سبغە د لیستا جۆرێن سبغێ دا نینە':'کۆمپانیەکێ هەلبژێرە'}`);return}
    if(!docs.length){toast('⚠️ ژمارا کارتۆنان بنڤیسە');return}
    if(await addTx('in',docs)){const kgT=docs.reduce((s,d)=>s+(d.kg||0),0);S.bin[S.invKind]=null;toast(`✓ ${docs.length} ڕیز هاتنە داخلکرن (${kgT?fmt(kgT,1)+' کیلۆ':fmt(docs.reduce((s,d)=>s+d.qty,0),1)+' کارتۆن'})`);render()}}
  else if(act==='txAdd'){const dir=t.dataset.dir;if(!can(dir==='in'?'inv_in':'inv_out')||!canKind(S.invKind)){toast('⚠️ ئەڤ کار بۆ تە نەهاتیە ڤەکرن');return}const f=txF(dir);const q0=toNum(f.qty);let qty=q0,kg=null;
    if(!(q0>0)){toast('⚠️ '+(f.kind==='paint'?'چەندیێ':'ژمارا کارتۆنان')+' بنڤیسە');return}
    let sec,key;if(f.kind==='paint'){const k=norm(f.paint);if(!paintDef(k)){toast('⚠️ ئەڤ سبغە د لیستا جۆرێن سبغێ دا نینە');return}sec='cart';key=k;
      const kgc=kgcOf({stock:S.inv},k);if(f.unit==='ctn'){kg=q0*kgc}else{kg=f.unit==='t'?q0*1000:q0;qty=+(kg/kgc).toFixed(4)}}
    else{const bk=brandKey(f.brand);if(!f.brand){toast('⚠️ کۆمپانیەکێ هەلبژێرە');return}sec='box';key=bk+'|'+toNum(f.w)+'|'+f.t+'|'+toNum(f.len)}
    if(dir==='out'&&toNum(S.inv[sec][key])<qty-1e-4){toast(`⚠️ ل مەخزەنێ تەنێ ${sec==='cart'?paintCurTxt(key):fmt(toNum(S.inv[sec][key]),1)+' کارتۆن'} هەنە`);return}
    const meU=myUid();const tk=(dir==='out'&&canProxy()&&f.taker)?f.taker:meU;
    const doc={at:new Date().toISOString(),u:tk,...(tk!==meU?{rec:meU}:{}),sec,key,qty,...(kg!==null?{kg:+kg.toFixed(2)}:{}),note:String(f.note||'').trim()};
    if(!db){doc.id='l'+Date.now();S.tx[dir].push(doc);recomputeInv();localSave()}
    else{try{setStatus('تۆمارکرن...');await db.collection(dir==='in'?'invin':'invout').add(doc);setStatus('✓ هاتە تۆمارکرن')}catch(e){setStatus(e&&e.code==='invalid_argument'?'⚠️ تو دەستووری ڤی کاری نینە':'⚠️ تۆمار نەبوو: '+(e&&e.code||e),true);return}}
    f.qty='';f.note='';toast(`✓ ${dir==='in'?'داخلکرن':'دەرئێخستن'}: ${kg!==null?fmt(kg,1)+' کیلۆ':fmt(qty,1)+' کارتۆن'} ${txLabel(sec,key)}${tk!==meU?' — بۆ '+esc(uName(tk)):''}`);render()}
  else if(act==='txEdit'&&isAdmin){txEdit(t0.dataset.dir,t0.dataset.id)}
  else if(act==='txDel'&&isAdmin){const dir=t0.dataset.dir,id=t0.dataset.id;dialog('<p>ئەڤ تۆمارە ژێببە؟ مەخزەن دێ ل دویڤ هێتە ڕاستکرن.</p>',async()=>{
      if(!db){S.tx[dir]=S.tx[dir].filter(x=>x.id!==id);recomputeInv();localSave();render();return}
      try{await db.doc((dir==='in'?'invin/':'invout/')+id).delete()}catch(e){toast('⚠️ ژێبرن نەبوو')}},'ژێببە')}
  else if(act==='lockP'&&p){p.stock=normStock(JSON.parse(JSON.stringify(S.inv||{})));p.locked=true;p.lockedAt=new Date().toISOString();save('periods/'+p.id,100);render();toast('🔒 مەخزەنا نوکە بۆ ڤێ ماوەیێ هاتە پاشەکەفتکرن')}
  else if(act==='unlockP'&&p){dialog('<p>ڤەکرنا قفلێ: ئەنجامێن ڤێ ماوەیێ دێ دیسا ب مەخزەنا زیندی هێنە حیسابکرن.</p>',()=>{p.locked=false;p.lockedAt='';save('periods/'+p.id,100);render()},'ڤەکرن')}
  else if(act==='selShort'&&p){ensP(p);const ks=JSON.parse(t.dataset.keys);const a=p.sel[t.dataset.kind];ks.forEach(k=>{if(!a.includes(k))a.push(k)});save('periods/'+p.id,300);render()}
  else if(act==='selClear'&&p){ensP(p);p.sel[t.dataset.kind]=[];save('periods/'+p.id,300);render()}
  else if(act==='unsel'&&p){ensP(p);const a=p.sel[isPaintKind(t.dataset.kind)?'paint':'tape']||[];const i=a.indexOf(t.dataset.k);if(i>=0)a.splice(i,1);save('periods/'+p.id,300);render()}
  else if(act==='pdf'&&p){
    if(!downloads){toast('⚠️ داگرتن ل ڤێرە بەردەست نینە');return}
    const kind=t.dataset.kind;const po=getPo(p,kind);const d=poDefaults(p,kind);po.no=po.no||d.no;po.date=po.date||d.date;po.supplier=po.supplier||d.supplier;
    if(!poItems(p,kind).some(x=>x.qty>0)){toast('⚠️ چ ژمارەکا داخوازیێ نینە');return}
    pickLang('PDF داخوازیێ (Purchase Order)',async lang=>{const pth='periods/'+p.id;clearTimeout(timers[pth]);dirty[pth]=true;flush(pth);if(lang==='ar'){printHtml(arPoHtml(p,kind),(d.no||'purchase-order')+'-ar');return}
    try{const {buf,name}=await makePdf(p,kind);await downloads.save({filename:name,data:new Uint8Array(buf)});toast('✓ PDF هاتە دروستکرن')}
    catch(err){if(!err||err.code!=='declined')toast('⚠️ PDF دروست نەبوو'+(err&&err.code?' ('+err.code+')':(err&&err.message?' ('+err.message+')':'')))}})
  }
  else if(act==='__none'){}
  else if(act==='addPco'){const v=$('#newPco').value.trim();if(v&&!S.settings.paintCos.some(x=>norm(x)===norm(v))){S.settings.paintCos.push(v);save('cfg/settings',200)}render()}
  else if(act==='delPco'){const x=S.settings.paintCos[+t0.dataset.i];dialog(`<p>کۆمپانیا <b class="ltr">${esc(x)}</b> ژێببە؟</p>`,()=>{S.settings.paintCos.splice(+t0.dataset.i,1);S.paints.forEach(c=>{if(c.co===x)c.co=''});save('cfg/settings',100);save('cfg/paints',100);render()},'ژێببە')}
  else if(act==='profPdf'){
    const om=$('#profOnlyMissing')&&$('#profOnlyMissing').checked;if(!profileList(om).length){toast('⚠️ چ پڕۆفایل نینن');return}
    try{const buf=await makeProfilesPdf(om);await saveFile(`profiles-check-${today().replace(/-/g,'')}.pdf`,new Uint8Array(buf),'application/pdf')}catch(e){toast('⚠️ PDF دروست نەبوو'+(e&&e.message?' ('+e.message+')':''))}
  }
  else if(act==='profXlsx'){
    const om=$('#profOnlyMissing')&&$('#profOnlyMissing').checked;
    try{const X=await loadXLSX();const rows=[['Code','First band (mm)','Both','Second band (mm)','Both 2','Weight (kg/m)','Wrap','Perimeter (mm)']].concat(profileList(om).map(p=>[p.code,p.b1||'',p.s1===2?'yes':'',p.b2||'',p.s2===2?'yes':'',p.w||'',p.wrap?'yes':'',p.per||'']));
      const ws=X.utils.aoa_to_sheet(rows);ws['!cols']=[{wch:12},{wch:15},{wch:6},{wch:16},{wch:7},{wch:13},{wch:6},{wch:14}];const wb=X.utils.book_new();X.utils.book_append_sheet(wb,ws,'Profiles');
      await saveFile(`profiles-${today().replace(/-/g,'')}.xlsx`,new Uint8Array(X.write(wb,{bookType:'xlsx',type:'array'})),'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet')}
    catch(e){toast('⚠️ Excel دروست نەبوو')}
  }
  else if(act==='copyBackup'){
    const txt=JSON.stringify(exportData());
    try{await navigator.clipboard.writeText(txt);toast('✓ Backup هاتە کۆپیکرن — ل جهەکێ پاراستی پەیست بکە')}
    catch(err){const o=$('#backupOut');if(o){o.innerHTML=`<p class="muted">کۆپیکرن ب خۆ نەبوو. ڤێ نڤیسینێ هەلبژێرە (Ctrl+A) و کۆپی بکە:</p><textarea readonly style="min-height:120px">${esc(txt)}</textarea>`;const ta=o.querySelector('textarea');ta.focus();ta.select()}}
  }
  else if(act==='importPaste'){const v=$('#importText').value.trim();if(v)confirmImport(v,'پەیستکرن')}
  else if(act==='exportAll'){await doBackup()}
  else if(act==='sbResync'&&db&&db.resync){await db.resync();toast('✓ داتا هاتنە نووکرن')}
  else if(act==='addTape'){const w=toNum($('#newTapeW').value),r=toNum($('#newTapeR').value)||1;if(w>0&&!tapeDef(w)){S.settings.tapes.push({w,rpb:r,on:true,sub:0});S.settings.tapes.sort((a,b)=>a.w-b.w);save('cfg/settings',200)}render()}
  else if(act==='delTape'){const t=S.settings.tapes[+t0.dataset.i];dialog(`<p>پانیا <b class="ltr">${t.w} mm</b> ژێببە؟</p>`,()=>{S.settings.tapes.splice(+t0.dataset.i,1);S.settings.tapes.forEach(x=>{if(x.sub===t.w)x.sub=0});save('cfg/settings',100);render()},'ژێببە')}
  else if(act==='profPaste'){importProfiles(parseProfiles(parseText($('#profPaste').value)))}
  else if(act==='addProf'){S.profiles.unshift({code:'',b1:0,b2:0,s1:1,s2:1,w:0});profFilter='';save('cfg/profiles');render();const i=$('#main').querySelector('input[data-p="0"]');if(i)i.focus()}
  else if(act==='delProf'){const x=S.profiles[+t.dataset.i];dialog(`<p>پڕۆفایلێ <b class="ltr">${esc(x.code)}</b> ژێببە؟</p>`,()=>{S.profiles.splice(+t.dataset.i,1);save('cfg/profiles',100);render()},'ژێببە')}
  else if(act==='paintPaste'){importPaints(parsePaints(parseText($('#paintPaste').value)))}
  else if(act==='hexClr'){const x=S.paints[+t0.dataset.i];if(x){delete x.hex;save('cfg/paints',100);render()}}
  else if(act==='addPaint'){S.paints.push({name:'',type:'N',kgc:25,co:'',pul:''});save('cfg/paints');render();const ins=$('#main').querySelectorAll('input[data-c]');if(ins.length)ins[ins.length-1].focus()}
  else if(act==='delPaint'){S.paints.splice(+t.dataset.i,1);save('cfg/paints',100);render()}
  else if(act==='copyRes'&&p){
    const {tape,paint}=resultTables(p);
    const w=t.dataset.what;const txt=[`${p.name} (${p.start} - ${p.end})`,'',...(w==='paint'?['PAINT',...paint.map(r=>r.join('\t'))]:['TAPE',...tape.map(r=>r.join('\t'))])].join('\n');
    try{await navigator.clipboard.writeText(txt);toast('✓ هاتە کۆپیکرن — دشێی د ئێکسلێ دا پەیست بکەی')}catch(err){toast('⚠️ کۆپیکرن نەبوو')}
  }
  else if(act==='export'&&p&&downloads){
    try{
      const X=await loadXLSX();const {tape,paint,orders}=resultTables(p);
      const wb=X.utils.book_new();
      X.utils.book_append_sheet(wb,X.utils.aoa_to_sheet(tape),'Tape');
      X.utils.book_append_sheet(wb,X.utils.aoa_to_sheet(paint),'Paint');
      X.utils.book_append_sheet(wb,X.utils.aoa_to_sheet(orders),'Orders');
      const buf=X.write(wb,{bookType:'xlsx',type:'array'});
      const fn=('band-order '+(p.start||'')+' '+(p.end||'')).trim().replace(/[^\w\- ]/g,'')+'.xlsx';
      await downloads.save({filename:fn,data:new Uint8Array(buf)});
    }catch(err){if(!err||err.code!=='declined')toast('⚠️ داگرتن نەبوو'+(err&&err.code?' ('+err.code+')':''))}
  }
});

(()=>{const h=location.hash.slice(1);const t=Object.keys(HASH).find(k=>HASH[k]===h);if(t)S.tab=t})();
if(SB_ON&&'serviceWorker' in navigator&&location.protocol==='https:'){navigator.serviceWorker.register('sw.js').catch(()=>{})}
render();
initDb();
</script>
